---
- name: Verificaciones y configuracion en servidores Windows
  hosts: all
  gather_facts: yes

  vars:
    usuario_ansible: ansible
    servicios_criticos:
      - Spooler
      - W32Time
      - WinRM

  tasks:

    - name: Mostrar version del sistema operativo
      debug:
        msg: "Sistema operativo: {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Verificar uso de CPU
      ansible.windows.win_shell: |
        (Get-Counter '\Processor(_Total)\% Processor Time').CounterSamples.CookedValue
      register: cpu_usage

    - name: Mostrar uso de CPU
      debug:
        msg: "Uso de CPU: {{ cpu_usage.stdout }} %"

    - name: Obtener informacion de servicios criticos
      ansible.windows.win_service_info:
        name: "{{ item }}"
      loop: "{{ servicios_criticos }}"
      register: servicios_estado

    - name: Mostrar estado de servicios (corregido)
      debug:
        msg: >-
          Servicio {{ item.item }} esta
          {{ item.services[0].state if (item.services | length > 0) else 'no encontrado' }}
      loop: "{{ servicios_estado.results }}"

    - name: Crear usuario ansible
      ansible.windows.win_user:
        name: "{{ usuario_ansible }}"
        state: present
        groups:
          - Users

    - name: Verificar actualizaciones disponibles
      ansible.windows.win_updates:
        category_names:
          - CriticalUpdates
          - SecurityUpdates
        state: searched
      register: updates

    - name: Mostrar cantidad de actualizaciones disponibles
      debug:
        msg: "Actualizaciones disponibles: {{ updates.found_update_count }}"

    - name: Instalar actualizaciones si existen
      ansible.windows.win_updates:
        category_names:
          - CriticalUpdates
          - SecurityUpdates
        state: installed
        reboot: yes
      when: updates.found_update_count > 0
